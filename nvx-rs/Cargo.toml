[package]
name = "nvx-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NVX mechanics: the OpenVMM control protocol and the launch, policy lowering, and supervision of NVX microVMs"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
keywords = ["sandbox", "microvm", "openvmm", "virtualization"]
categories = ["virtualization"]
publish = false
# Lets the build scripts of dependents read the staged bundle as `DEP_NVX_ARTIFACTS_DIR`.
links = "nvx"

[lib]
name = "nvx"

[features]
default = ["host"]
# The host side: artifact discovery, launch, network and filesystem lowering, control sessions,
# process and platform primitives, and the supervision of VM instances.
host = ["serde", "dep:getrandom", "dep:serde_json", "dep:libc", "dep:windows-sys"]
# Stages the OpenVMM executable, guest kernel, and control initramfs at build time; see
# `Artifacts::bundled`. The build script downloads the release pinned in `artifacts.json`, or
# copies the release directory named by `NVX_BUNDLE_DIR`.
bundled = ["host", "dep:sha2"]
# Test doubles: the fake OpenVMM of `testing::fake_openvmm` and its `nvx-fake-openvmm` binary.
testing = ["dep:getrandom", "dep:serde", "dep:serde_json", "dep:libc", "dep:windows-sys"]
# The serde form of `Hypervisor`. The `host` feature enables it.
serde = ["dep:serde"]
# The programs that run in Linux guests: the `guest` module and the `nvx-*` guest binaries. Build
# them with `--no-default-features --features guest` and the `guest` profile; see README.md.
guest = ["dep:libc"]

[dependencies]
getrandom = { version = "0.4", optional = true }
serde = { version = "1.0.200", features = ["derive"], optional = true }
serde_json = { version = "1.0.120", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.160", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
# Only the `bundled` build script reads JSON; `host`, which `bundled` enables, enables it here too.
serde_json = { version = "1.0.120", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
serde_json = "1.0.120"
tempfile = "3.10"

[[bin]]
name = "nvx-fake-openvmm"
path = "src/bin/nvx-fake-openvmm.rs"
required-features = ["testing"]
doc = false

# The guest binaries. Their unit tests live in the library, so the binaries have no test harness.
[[bin]]
name = "nvx-console-pending"
path = "src/bin/nvx-console-pending.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-mmio-write"
path = "src/bin/nvx-mmio-write.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-port-io"
path = "src/bin/nvx-port-io.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-reseed"
path = "src/bin/nvx-reseed.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-managed-agent"
path = "src/bin/nvx-managed-agent.rs"
required-features = ["guest"]
doc = false
test = false

# The guest profile builds these two freestanding, which takes the link flags in README.md.
[[bin]]
name = "nvx-exit"
path = "src/bin/nvx-exit.rs"
required-features = ["guest"]
doc = false
test = false

[[bin]]
name = "nvx-device-io"
path = "src/bin/nvx-device-io.rs"
required-features = ["guest"]
doc = false
test = false

# The guest binaries: small, static, and stripped. Its `panic = "abort"` also selects the
# freestanding form of nvx-exit and nvx-device-io, which unwinding profiles cannot build.
[profile.guest]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
