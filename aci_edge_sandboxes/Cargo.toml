[package]
name = "aci_edge_sandboxes"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rust interface to the ACI Edge Sandboxes lifecycle"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
keywords = ["sandbox", "microvm", "openvmm", "virtualization"]
categories = ["virtualization", "api-bindings"]
publish = false
# Lets the build scripts of dependents read the bundle that `nvx` staged as
# `DEP_ACI_EDGE_SANDBOXES_ARTIFACTS_DIR`.
links = "aci_edge_sandboxes"

[features]
default = ["openvmm"]
# The default backend, which drives the `openvmm` binary directly through `nvx`.
openvmm = ["nvx/host"]
# Stages the OpenVMM executable, guest kernel, and control initramfs at build time; see
# `nvx::Artifacts::bundled`. The build script of `nvx` downloads the release pinned in its
# `artifacts.json`, or copies the release directory named by `NVX_BUNDLE_DIR`.
bundled = ["openvmm", "nvx/bundled"]
# Tokio-based asynchronous wrappers around the synchronous core.
async = ["dep:tokio"]
# A thin client of an explicitly supplied native agent library that owns the sandbox lifecycle.
agent = ["dep:libloading", "dep:sha2"]
# Downloads and verifies the edge agent bundle at build time and stages it beside the
# executables, so that `agent::AgentConfig::bundled` needs no paths or digests. The build script
# downloads `aci-edge-sandboxes.zip` from the release of the commit being built, or of its nearest
# first-parent ancestor that has one; see `agent::BundledAgent`.
agent-bundled = [
    "agent",
    "dep:serde_json",
    "dep:sha2",
    "dep:aci_edge_sandboxes_model",
    "dep:static_assertions",
]
# Test doubles: an in-memory `MockBackend` and the `aci-edge-sandboxes-fake-openvmm` binary.
testing = ["nvx/testing"]

[dependencies]
aci_edge_sandboxes_model = { path = "model", version = "0.1.0" }
nvx = { path = "../nvx-rs", version = "0.1.0-alpha.3", default-features = false }
libloading = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
# Checks at compile time that a staged agent bundle speaks this crate's sandbox ABI.
static_assertions = { version = "1.1.0", optional = true }
tokio = { version = "1.40", default-features = false, features = ["rt", "sync"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.160" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
# Only the `agent-bundled` build script reads the bundle's manifests and digests, and it checks the
# bundle's sandbox ABI against the model's before installing the bundle.
aci_edge_sandboxes_model = { path = "model", version = "0.1.0", optional = true }
serde_json = { version = "1.0.120", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "io-util", "time"] }

[[bin]]
name = "aci-edge-sandboxes-fake-openvmm"
path = "src/bin/aci-edge-sandboxes-fake-openvmm.rs"
required-features = ["testing", "openvmm"]
doc = false

[[example]]
name = "lifecycle"
required-features = ["openvmm"]

[[example]]
name = "agent_lifecycle"
required-features = ["agent"]

[workspace]
members = ["model"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
