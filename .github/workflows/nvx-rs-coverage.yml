name: nvx-rs coverage

# Measures, on Linux and Windows, the lines and branches of the nvx crate that
# each family of golden tests alone reaches, which the tests that retire a
# family have to reach too (microsoft/nvx#722; doc/ci.md, "nvx-rs coverage").
# It runs weekly, on demand, and for pushes that change it or its script, never
# for pull requests, so no required check depends on it.
on:
  schedule:
    - cron: "37 6 * * 0"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nvx-rs-coverage.yml
      - scripts/nvx_rs_coverage.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # cargo-llvm-cov's branch coverage needs a nightly compiler.
  COVERAGE_TOOLCHAIN: nightly-2026-07-09
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  measure:
    name: measure / ${{ matrix.os }}
    if: github.event_name != 'schedule' || github.repository == 'microsoft/nvx'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the coverage toolchain and cargo-llvm-cov
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${COVERAGE_TOOLCHAIN}" --profile minimal \
            --component llvm-tools
          cargo "+${COVERAGE_TOOLCHAIN}" install --locked cargo-llvm-cov \
            --version "${CARGO_LLVM_COV_VERSION}"

      - name: Measure the coverage of each selection of tests
        shell: bash
        env:
          # --all-features enables `bundled`; stage nothing instead of downloading a release.
          NVX_BUNDLE: skip
        run: >-
          python scripts/nvx_rs_coverage.py measure
          --toolchain "${COVERAGE_TOOLCHAIN}"
          --output build/nvx-rs-coverage

      # A measurement whose tests failed still records what the other tests
      # reached, and the summary names the selections that failed. A rerun of
      # the job replaces the measurement of its earlier attempt.
      - name: Upload the measurement
        if: ${{ !cancelled() && hashFiles('build/nvx-rs-coverage/measurement.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-coverage-measurement-${{ runner.os }}-${{ github.run_id }}
          path: build/nvx-rs-coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  summarize:
    name: summarize
    needs: measure
    # Summarizes the measurement of one OS when the other failed.
    if: ${{ !cancelled() && needs.measure.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The latest measurement of each system, also when an earlier attempt of
      # the run took it.
      - name: Download the measurements
        uses: actions/download-artifact@v8
        with:
          pattern: nvx-rs-coverage-measurement-*-${{ github.run_id }}
          path: build/nvx-rs-coverage

      - name: Summarize the measurements
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          measurements=(build/nvx-rs-coverage/*/)
          if (( ${#measurements[@]} == 0 )); then
            echo "::error::No measurement finished."
            exit 1
          fi
          python3 scripts/nvx_rs_coverage.py summarize "${measurements[@]}" \
            --json build/nvx-rs-coverage-summary.json > build/nvx-rs-coverage-summary.md
          cat build/nvx-rs-coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the summary
        uses: actions/upload-artifact@v7
        with:
          name: nvx-rs-coverage-summary-${{ github.run_id }}
          path: |
            build/nvx-rs-coverage-summary.md
            build/nvx-rs-coverage-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
