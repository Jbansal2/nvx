name: Check nvx-rs
description: Format, lint, document, and test the nvx-rs crate

inputs:
  toolchain:
    description: >-
      Rust toolchain used for formatting, linting, and tests. Defaults to the release
      that the repository's rust-toolchain.toml pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchains
      id: toolchains
      shell: bash
      working-directory: nvx-rs
      env:
        REQUESTED_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        toolchain=${REQUESTED_TOOLCHAIN:-$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../rust-toolchain.toml)}
        msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        test -n "${toolchain}"
        test -n "${msrv}"
        rustup toolchain install "${toolchain}" --profile minimal \
          --component clippy,rustfmt
        rustup toolchain install "${msrv}" --profile minimal
        {
          echo "toolchain=${toolchain}"
          echo "msrv=${msrv}"
        } >> "${GITHUB_OUTPUT}"

    - name: Check formatting
      shell: bash
      working-directory: nvx-rs
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" fmt --all --check

    - name: Lint
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --all-targets --all-features \
          -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --lib --no-default-features \
          -- -D warnings

    - name: Test
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --all-features
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked

    # Stages a synthetic release, which the bundled-artifacts test then requires to find.
    - name: Check artifact bundling
      shell: bash
      working-directory: nvx-rs
      run: |
        set -euo pipefail
        bundle=$(mktemp -d)
        executable=openvmm
        bundle_dir="${bundle}"
        if [[ "${RUNNER_OS}" == Windows ]]; then
          executable=openvmm.exe
          bundle_dir=$(cygpath -w "${bundle}")
        fi
        mkdir -p "${bundle}/bin" "${bundle}/guest"
        printf openvmm > "${bundle}/bin/${executable}"
        printf kernel > "${bundle}/guest/vmlinux"
        printf initramfs > "${bundle}/guest/initramfs.cpio.gz"
        cp ../SOURCE-MANIFEST.json "${bundle}/"
        (cd "${bundle}" && sha256sum "bin/${executable}" guest/vmlinux \
          guest/initramfs.cpio.gz SOURCE-MANIFEST.json > SHA256SUMS)
        NVX_BUNDLE_DIR="${bundle_dir}" cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --lib \
          --features bundled artifacts

    - name: Build documentation
      shell: bash
      working-directory: nvx-rs
      env:
        NVX_BUNDLE: skip
        RUSTDOCFLAGS: -D warnings
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" doc --locked --no-deps --all-features

    - name: Check the minimum supported Rust version
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: >-
        cargo "+${{ steps.toolchains.outputs.msrv }}" check
        --locked --all-targets --all-features

    - name: Check the macOS build
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        NVX_BUNDLE: skip
      run: |
        set -euo pipefail
        rustup target add --toolchain "${{ steps.toolchains.outputs.toolchain }}" aarch64-apple-darwin
        cargo "+${{ steps.toolchains.outputs.toolchain }}" check --locked --all-targets --all-features \
          --target aarch64-apple-darwin

    # The guest binaries are static x86_64-unknown-linux-musl executables; see the README's
    # guest binaries section.
    - name: Lint the guest binaries
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      run: |
        set -euo pipefail
        rustup target add --toolchain "${{ steps.toolchains.outputs.toolchain }}" x86_64-unknown-linux-musl
        guest=(--locked --target x86_64-unknown-linux-musl --no-default-features --features guest)
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy "${guest[@]}" --all-targets -- -D warnings
        # The guest profile's binaries, including the freestanding form of nvx-exit and nvx-device-io.
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy "${guest[@]}" --profile guest --bins \
          -- -D warnings

    # Static musl test binaries run on the runner, and check musl's strerror text.
    - name: Test the guest binaries
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      run: >-
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked
        --target x86_64-unknown-linux-musl --no-default-features --features guest

    - name: Build and check the guest binaries
      if: runner.os == 'Linux'
      shell: bash
      working-directory: nvx-rs
      run: |
        set -euo pipefail
        guest=(--locked --profile guest --target x86_64-unknown-linux-musl
          --no-default-features --features guest)
        std_binaries=(nvx-console-pending nvx-mmio-write nvx-port-io nvx-reseed nvx-managed-agent
          nvx-ingress)
        freestanding_binaries=(nvx-exit nvx-device-io)
        build=()
        for binary in "${std_binaries[@]}"; do
          build+=(--bin "${binary}")
        done
        cargo "+${{ steps.toolchains.outputs.toolchain }}" build "${guest[@]}" "${build[@]}"
        # Freestanding: no C runtime start files or libc, and a non-PIE executable.
        for binary in "${freestanding_binaries[@]}"; do
          cargo "+${{ steps.toolchains.outputs.toolchain }}" rustc "${guest[@]}" --bin "${binary}" -- \
            -C relocation-model=static -C link-self-contained=no \
            -C link-arg=-nostartfiles -C link-arg=-nostdlib -C link-arg=-static \
            -C link-arg=-no-pie -C link-arg=-Wl,--build-id=none \
            -C link-arg=-Wl,-z,noexecstack
        done
        directory="${PWD}/target/x86_64-unknown-linux-musl/guest"
        binaries=()
        for binary in "${std_binaries[@]}" "${freestanding_binaries[@]}"; do
          binaries+=("${directory}/${binary}")
        done
        python3 ../scripts/nvx.py check-static-elf "${binaries[@]}"
        # Runs the integration tests against the guest-profile builds.
        NVX_GUEST_BINARIES="${directory}" cargo "+${{ steps.toolchains.outputs.toolchain }}" test \
          --locked --target x86_64-unknown-linux-musl --no-default-features --features guest \
          --test guest_tools
